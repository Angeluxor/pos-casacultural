# Configuración de Alembic para el POS Casi Obsceno.
#
# La URL de la base de datos NO se fija aquí: la resuelve `alembic/env.py` a
# partir de las variables de entorno, prefiriendo `DATABASE_URL_UNPOOLED`
# (cadena directa de Neon, recomendada para DDL) y usando `DATABASE_URL` como
# respaldo.
[alembic]
script_location = alembic
prepend_sys_path = .
# Vacío a propósito: env.py lo sobrescribe con la URL del entorno.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
