server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback para SPA (React Router usa BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea los assets con hash (Vite los versiona)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
